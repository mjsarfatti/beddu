name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # /bin/bash on macOS is bash 3.2
          - os: macos-latest
            bash: /bin/bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make test BASH_BIN=${{ matrix.bash }}
